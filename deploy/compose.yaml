name: customer-portal

services:
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.console
    image: kineticrouter/customer-portal-web:${PORTAL_IMAGE_TAG:-dev}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3100:8080"
    cpus: 0.25
    mem_limit: 128m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=16m
      - /var/run:size=2m
      - /tmp:size=8m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    networks:
      - frontend

  bff:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.bff
    image: kineticrouter/customer-portal-bff:${PORTAL_IMAGE_TAG:-dev}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3101
      PORTAL_ORIGIN: https://console.kineticrouter.com
      SUB2API_BASE_URL: https://api.kineticrouter.com/api/v1
      REDIS_URL: redis://redis:6379/0
      TRUST_PROXY: "true"
    ports:
      - "127.0.0.1:3101:3101"
    depends_on:
      redis:
        condition: service_healthy
    cpus: 0.50
    mem_limit: 256m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=16m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    networks:
      - backend

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory", "96mb", "--maxmemory-policy", "noeviction"]
    cpus: 0.25
    mem_limit: 128m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - portal-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    networks:
      - backend

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge

volumes:
  portal-redis:
